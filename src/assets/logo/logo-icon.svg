<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="aurora" x1="40" y1="20" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#37C7FF"/>
      <stop offset="50%" stop-color="#4CCEFF"/>
      <stop offset="100%" stop-color="#4FE3C1"/>
    </linearGradient>

    <linearGradient id="inner" x1="80" y1="60" x2="170" y2="170">
      <stop offset="0%" stop-color="#091522"/>
      <stop offset="100%" stop-color="#04070C"/>
    </linearGradient>

    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#37C7FF" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4FE3C1" flood-opacity=".25"/>
    </filter>

  </defs>

  <!-- OUTER DIAMOND -->

  <g filter="url(#shadow)">

    <path
      d="M128 24
         L216 112
         L128 200
         L40 112
         Z"
      fill="url(#aurora)"
    />

    <!-- INNER DIAMOND -->

    <path
      d="M128 52
         L188 112
         L128 172
         L68 112
         Z"
      fill="url(#inner)"
    />

    <!-- CORE -->

    <circle
      cx="128"
      cy="112"
      r="15"
      fill="#4FE3C1"
    />

    <!-- GLOW RING -->

    <circle
      cx="128"
      cy="112"
      r="27"
      stroke="#37C7FF"
      stroke-opacity=".35"
      stroke-width="2"
      fill="none"
    />

  </g>

</svg>