<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 110"
    width="520"
    height="110">

    <defs>

        <linearGradient
            id="aurora"
            x1="20"
            y1="10"
            x2="110"
            y2="95">

            <stop offset="0%" stop-color="#37C7FF"/>
            <stop offset="55%" stop-color="#4BCFFF"/>
            <stop offset="100%" stop-color="#4FE3C1"/>

        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">

            <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="6"
                flood-color="#37C7FF"
                flood-opacity=".30"/>

            <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="10"
                flood-color="#4FE3C1"
                flood-opacity=".25"/>

        </filter>

    </defs>

    <!-- ICON -->

    <g filter="url(#glow)">

        <path
            d="
                M55 16
                L92 53
                L55 90
                L18 53
                Z
            "
            fill="url(#aurora)"/>

        <path
            d="
                M55 31
                L77 53
                L55 75
                L33 53
                Z
            "
            fill="#04070C"/>

        <circle
            cx="55"
            cy="53"
            r="6"
            fill="#4FE3C1"/>

    </g>

    <!-- WORDMARK -->

    <text
        x="120"
        y="58"
        font-size="42"
        font-weight="800"
        font-family="Inter,Segoe UI,sans-serif"
        fill="#F3F6FA">

        Lite<tspan fill="url(#aurora)">Post</tspan>

    </text>

    <!-- TAGLINE -->

    <text
        x="122"
        y="83"
        font-size="13"
        font-weight="500"
        letter-spacing=".8"
        font-family="Inter,Segoe UI,sans-serif"
        fill="#8EA6BF">

        DECENTRALIZED SOCIAL ON

        <tspan
            fill="#4FE3C1"
            font-weight="700">

            LITVM

        </tspan>

    </text>

</svg>