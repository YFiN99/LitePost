<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    width="64"
    height="64">

    <defs>

        <linearGradient
            id="aurora"
            x1="8"
            y1="8"
            x2="56"
            y2="56">

            <stop offset="0%" stop-color="#37C7FF"/>
            <stop offset="100%" stop-color="#4FE3C1"/>

        </linearGradient>

        <filter id="glow">

            <feGaussianBlur
                stdDeviation="1.8"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>

    <!-- Diamond -->

    <g filter="url(#glow)">

        <path
            d="
                M32 6
                L58 32
                L32 58
                L6 32
                Z
            "
            fill="url(#aurora)"/>

        <!-- Inner -->

        <path
            d="
                M32 16
                L48 32
                L32 48
                L16 32
                Z
            "
            fill="#07111F"/>

        <!-- Center -->

        <circle
            cx="32"
            cy="32"
            r="4"
            fill="#4FE3C1"/>

    </g>

</svg>